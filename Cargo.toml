[package]
name = "nexus_production"
version = "26.10.26"
edition = "2024"

[dependencies]
tiberius = { version = "0.12", default-features = false, features = ["tds73", "sql-browser-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
